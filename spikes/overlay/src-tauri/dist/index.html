<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>overlay spike</title>
    <style>
      /* Transparent and unpainted everywhere: a panel with a background shows up
         immediately if the platform cannot do transparency, which is itself an
         answer worth having. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }

      /* Size pinned from CSS rather than trusted from the window request: an
         earlier version of this spike asked for 140x150 and was answered with
         200x239, so the question is which of the two wins. */
      #root {
        width: 140px;
        height: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      /* No filter. A drop-shadow expands the filter region, and in an earlier
         version it was a candidate for feeding the size discrepancy. */
      .tag {
        font: 10px ui-monospace, monospace;
        color: #cfc6ff;
        background: rgba(20, 18, 40, 0.85);
        padding: 1px 6px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <!--
      A stand-in for the mascot, drawn inline so the spike has no build step.
      It is deliberately NOT the real component: the spike asks a question about
      the window, and importing the mascot would make a dependency that has to
      be rebuilt on every machine the spike runs on.
    -->
    <div id="root">
      <div class="wrap">
        <svg width="82" height="59" viewBox="0 0 21.3 15.2" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="g" x1="0" y1="2" x2="0" y2="15.2" gradientUnits="userSpaceOnUse">
              <stop stop-color="#00E5FF" />
              <stop offset="0.53" stop-color="#7F80FF" />
              <stop offset="0.78" stop-color="#FF4DFF" />
              <stop offset="1" stop-color="#0099FF" />
            </linearGradient>
          </defs>
          <ellipse cx="10.65" cy="14.1" rx="9.13" ry="0.72" fill="#2800FF" opacity="0.55" />
          <path
            d="M15.5 8.4C15.7 6.9 14.8 6 13 6c-1.6 0-3-.05-3-1.2-1.5.45-2.1 1.5-2.3 2.85-.2 1.35-1.2 2-1.2 3.4 0 1.7 1.1 2.65 2.9 2.65h3.7c2 0 3-.85 3-2.2 0-1.05-.5-1.5-.4-2.2Z"
            fill="#00E5FF"
          />
          <path
            d="M14.4 7.9c-1.9.1-3.4 2-3.4 4.3 0 1.6 1.1 2.2 3.2 2.2 2.6 0 3.7-.5 3.7-2.3 0-2.3-1.6-4.2-3.5-4.2Z"
            fill="url(#g)"
            stroke="#0033FF"
            stroke-width="0.16"
          />
          <ellipse cx="11.4" cy="10.6" rx="0.82" ry="1.38" fill="#66F7FF" />
          <ellipse cx="14.6" cy="10.5" rx="0.77" ry="1.36" fill="#88F7FF" />
        </svg>
        <div class="tag">overlay spike</div>
      </div>
    </div>
  </body>
</html>
